name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      flutter_version: "3.47.5"
      min_coverage: 0
      timeout_minutes: 15

  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 9 + Android Gradle Plugin 9 butuh JDK 17 atau lebih baru.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Versi Flutter disamakan dengan laptop dan job build supaya hasilnya sama.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Kalau variabel repo API_BASE_URL belum diisi, pakai bawaan config.dart (10.0.2.2).
      # Kalau gagal, potongan log terakhir ditampilkan sebagai anotasi error di ringkasan run.
      - name: Build release APK
        shell: bash
        run: |
          flutter build apk --release ${{ vars.API_BASE_URL && format('--dart-define=API_BASE_URL={0}', vars.API_BASE_URL) || '' }} 2>&1 | tee build.log || {
            echo "::error title=flutter build apk::$(tail -c 3500 build.log | tr '\n' ' ')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
